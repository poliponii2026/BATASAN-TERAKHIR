<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>POLIPONI 2026 • WAITING ROOM V2</title>
<style>
body{font-family:Arial,sans-serif;background:#efede8;margin:0;padding:20px}
.main{max-width:900px;margin:auto;background:#fff;border:6px solid #000;padding:20px}
.title{font-size:48px;font-weight:bold;text-align:center;background:#ffe600;padding:20px;margin:20px 0}
.poster img,.size img{width:100%;border-radius:16px}
.queue,.time,.size{border:4px solid #000;padding:20px;margin:20px 0}
.queue{background:#00d63b;color:#fff;text-align:center}
#queueNum{font-size:72px;font-weight:bold}
.time{text-align:center}
.progressWrap{height:30px;background:#ddd;border:3px solid #000}
.progress{height:100%;width:0;background:linear-gradient(90deg,#ff5a1f,#ffe600,#00d63b)}
.btn{display:block;text-align:center;padding:20px;background:#999;color:#000;text-decoration:none;font-weight:bold}
.active{background:#00d9ff}
</style>
</head>
<body>
<div class="main">
<h1>POLIPONI 2026</h1>
<div class="title">BUNDLING<br>TIKET + MERCH</div>

<div class="poster">
<img src="bundling.jpg" alt="Bundling">
</div>

<div class="queue">
<h2>ANTRIAN AKSES BUNDLING</h2>
<div id="queueNum">1847</div>
</div>

<div class="size">
<h2>SIZE CHART</h2>
<img src="size.png" alt="Size Chart">
</div>

<div class="time">
<h2>ESTIMASI WAKTU</h2>
<div id="fakeTime">60 DETIK</div>
<div class="progressWrap"><div class="progress" id="progress"></div></div>
</div>

<a href="https://poliponii2026.github.io/Deskripsi-poliponi/" class="btn" id="buyBtn">MENUNGGU AKSES...</a>
</div>

<script>
const progress=document.getElementById('progress');
const buyBtn=document.getElementById('buyBtn');
let duration=60,current=60;
const c=setInterval(()=>{
current--;
progress.style.width=((duration-current)/duration*100)+'%';
document.getElementById('fakeTime').innerText=current+' DETIK';
if(current<=0){
clearInterval(c);
buyBtn.classList.add('active');
buyBtn.innerText='PILIH PAKET BUNDLING';
window.location.href='https://poliponii2026.github.io/Deskripsi-poliponi/';
}
},1000);
</script>
</body>
</html>
